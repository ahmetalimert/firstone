<title>Geotech Ground Truth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one mobile-first reading column; the home screen is a borehole log where each module is a stratum and each lesson is 1 m of depth. */
:root {
  --bg: #e9ece6;
  --surface: #f6f7f3;
  --surface2: #dfe4dc;
  --ink: #1b2320;
  --muted: #56625d;
  --line: #c4ccc2;
  --accent: #1d5a75;      /* groundwater */
  --accent-ink: #f3f8fa;
  --ochre: #9a6a1c;       /* sand */
  --ochre-soft: #efe0bf;
  --good: #2b6e45;
  --good-soft: #d5e8da;
  --bad: #9c3b22;
  --bad-soft: #f2d9d0;
  --s-fill: #8d8478; --s-clay: #6f7f8c; --s-sand: #c9a35a; --s-silt: #a39a7c; --s-gravel: #9b8c6e;
  --s-chalk: #c7c6bb; --s-mud: #7b6b5e; --s-rock: #6d7378; --s-rock2: #5a6270; --s-rock3: #4b5560;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --nav-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1a2220; --surface2: #222c29; --ink: #e3e9e5; --muted: #9aa8a2; --line: #33403c;
    --accent: #6cb3d1; --accent-ink: #0d1a20; --ochre: #d9a84f; --ochre-soft: #3a3020;
    --good: #6cc391; --good-soft: #1e3427; --bad: #e98a6e; --bad-soft: #3d2219;
    --s-fill: #776f64; --s-clay: #5d6e7b; --s-sand: #a9873f; --s-silt: #857d61; --s-gravel: #807256;
    --s-chalk: #8f8e84; --s-mud: #66574b; --s-rock: #5d6469; --s-rock2: #4d5563; --s-rock3: #414b56;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1a2220; --surface2: #222c29; --ink: #e3e9e5; --muted: #9aa8a2; --line: #33403c;
  --accent: #6cb3d1; --accent-ink: #0d1a20; --ochre: #d9a84f; --ochre-soft: #3a3020;
  --good: #6cc391; --good-soft: #1e3427; --bad: #e98a6e; --bad-soft: #3d2219;
  --s-fill: #776f64; --s-clay: #5d6e7b; --s-sand: #a9873f; --s-silt: #857d61; --s-gravel: #807256;
  --s-chalk: #8f8e84; --s-mud: #66574b; --s-rock: #5d6469; --s-rock2: #4d5563; --s-rock3: #414b56;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.1; margin: 0; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; }
.brand span { color: var(--accent); }
.gauge { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gauge-bar { width: 64px; height: 8px; background: var(--surface2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.gauge-bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }

main { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: var(--display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav svg { width: 22px; height: 22px; }

.eyebrow { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lead { font-size: 18px; color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.hero h1 { font-size: 34px; font-weight: 700; letter-spacing: .01em; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 10px 16px; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border-radius: 3px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.done { background: var(--good-soft); border-color: var(--good); color: var(--good); }

.resume { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-radius: 3px; }
.resume .txt { flex: 1 1 220px; min-width: 0; }
.resume h3 { font-size: 22px; }

.search { width: 100%; padding: 11px 14px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; }

/* Borehole log */
.log { border: 1px solid var(--line); background: var(--surface); border-radius: 3px; overflow: hidden; }
.log-head { display: grid; grid-template-columns: 58px 46px 1fr; font-family: var(--display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface2); }
.log-head div { padding: 6px 8px; }
.stratum { display: grid; grid-template-columns: 58px 46px 1fr; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; padding: 0; }
.stratum:last-child { border-bottom: 0; }
.stratum:hover .s-desc h3 { color: var(--accent); }
.s-depth { font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 8px 6px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.s-col { position: relative; border-right: 1px solid var(--line); min-height: 84px; }
.s-col .pat { position: absolute; inset: 0; opacity: .28; }
.s-col .pat.fillpart { opacity: 1; inset: 0 0 auto 0; }
.s-desc { padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.s-desc h3 { font-size: 21px; font-weight: 600; }
.s-desc p { margin: 0; font-size: 14.5px; color: var(--muted); }
.s-meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }

.p-fill { background-color: var(--s-fill); background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(0,0,0,.28) 6px 7px), repeating-linear-gradient(-45deg, transparent 0 9px, rgba(255,255,255,.18) 9px 10px); }
.p-clay { background-color: var(--s-clay); background-image: repeating-linear-gradient(0deg, transparent 0 7px, rgba(0,0,0,.35) 7px 8px); }
.p-sand { background-color: var(--s-sand); background-image: radial-gradient(rgba(0,0,0,.4) 1px, transparent 1.4px); background-size: 6px 6px; }
.p-silt { background-color: var(--s-silt); background-image: repeating-linear-gradient(0deg, transparent 0 8px, rgba(0,0,0,.3) 8px 9px), radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px); background-size: auto, 8px 8px; }
.p-gravel { background-color: var(--s-gravel); background-image: radial-gradient(circle, transparent 3px, rgba(0,0,0,.4) 3.2px, rgba(0,0,0,.4) 4px, transparent 4.3px); background-size: 13px 11px; }
.p-mud { background-color: var(--s-mud); background-image: repeating-linear-gradient(0deg, transparent 0 4px, rgba(0,0,0,.3) 4px 5px), repeating-linear-gradient(90deg, transparent 0 10px, rgba(255,255,255,.12) 10px 14px); }
.p-chalk { background-color: var(--s-chalk); background-image: repeating-linear-gradient(0deg, transparent 0 10px, rgba(0,0,0,.25) 10px 11px), repeating-linear-gradient(90deg, transparent 0 16px, rgba(0,0,0,.25) 16px 17px); }
.p-rock { background-color: var(--s-rock); background-image: linear-gradient(rgba(0,0,0,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.35) 1px, transparent 1px); background-size: 18px 10px; }
.p-rock2 { background-color: var(--s-rock2); background-image: repeating-linear-gradient(60deg, transparent 0 8px, rgba(0,0,0,.35) 8px 9px), repeating-linear-gradient(-30deg, transparent 0 12px, rgba(255,255,255,.12) 12px 13px); }
.p-rock3 { background-color: var(--s-rock3); background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgba(0,0,0,.3) 5px 6px), repeating-linear-gradient(45deg, transparent 0 5px, rgba(0,0,0,.3) 5px 6px); }

/* Module view */
.mod-head { display: grid; grid-template-columns: 14px 1fr; gap: 14px; }
.mod-head .bar { border-radius: 2px; }
.mod-head h1 { font-size: 32px; }
.lesson-list { display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--surface); border-radius: 3px; }
.lrow { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.lrow:last-child { border-bottom: 0; }
.lrow .num { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lrow .t { font-weight: 600; min-width: 0; }
.lrow .t small { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; }
.tick.on { background: var(--good); border-color: var(--good); color: var(--bg); }
.tick svg { width: 14px; height: 14px; }

/* Lesson */
.crumb { background: none; border: 0; padding: 0; cursor: pointer; color: var(--accent); font-family: var(--display); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; text-align: left; }
.lesson h1 { font-size: 34px; font-weight: 700; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.prose { max-width: 66ch; }
.prose p { margin: 0 0 12px; }
.prose ul { margin: 0 0 12px; padding-left: 20px; }
.prose li { margin-bottom: 6px; }
.prose b { font-weight: 700; }
.section-label { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.keys { border: 1px solid var(--line); background: var(--surface); border-radius: 3px; overflow: hidden; }
.keys .section-label { padding: 8px 14px; margin: 0; background: var(--surface2); border-bottom: 1px solid var(--line); }
.keys ul { list-style: none; margin: 0; padding: 0; }
.keys li { font-family: var(--mono); font-size: 13.5px; line-height: 1.5; padding: 9px 14px; border-bottom: 1px dashed var(--line); overflow-x: auto; }
.keys li:last-child { border-bottom: 0; }
.case { border: 1px solid var(--ochre); background: var(--ochre-soft); padding: 14px 16px; border-radius: 3px; }
.case .tag { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ochre); border: 1px solid var(--ochre); padding: 1px 7px; border-radius: 2px; margin-bottom: 6px; }
.case h3 { font-size: 22px; margin-bottom: 6px; }
.case p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 14.5px; cursor: pointer; text-align: left; display: inline-flex; gap: 6px; align-items: baseline; }
.chip .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.srcs { margin: 0; padding-left: 18px; font-size: 15px; }
.srcs li { margin-bottom: 4px; }

.q { border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; border-radius: 3px; display: flex; flex-direction: column; gap: 10px; }
.q .qt { font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; border-radius: 3px; cursor: pointer; font-size: 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { font-size: 15px; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 10px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager button { border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; text-align: left; cursor: pointer; border-radius: 3px; min-width: 0; }
.pager button:last-child { text-align: right; }
.pager small { display: block; font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-size: 12px; }
.pager span { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager button:disabled { visibility: hidden; }

/* Threads */
.thread { border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; border-radius: 3px; cursor: pointer; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.thread h3 { font-size: 22px; }
.thread p { margin: 0; color: var(--muted); font-size: 15px; }
.steps { list-style: none; margin: 0; padding: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 13px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.steps li { position: relative; padding: 0 0 18px 40px; }
.steps li .dot { position: absolute; left: 6px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.steps li .dot.on { background: var(--accent); }
.steps .stitle { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 700; color: var(--accent); font-size: 17px; }
.steps p { margin: 2px 0 0; font-size: 15px; color: var(--muted); }

/* Quiz */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 14.5px; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.score { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
select.sel { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 3px; max-width: 100%; }

.srcgroup h2 { font-size: 22px; margin-bottom: 8px; }
.srcgroup ul { margin: 0; padding-left: 18px; }
.srcgroup li { margin-bottom: 6px; }
.note { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.empty { color: var(--muted); padding: 12px 0; }

@media (min-width: 640px) {
  .hero h1, .lesson h1 { font-size: 42px; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
